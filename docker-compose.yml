version: '2.1'

services:
  web:
    build: .
    restart: always
    network_mode: host
    # JSON recebido do hub (srv-pve) persiste aqui entre restarts/updates.
    # HUB_TOKEN, HUB_URL, SEGMENTO e DEVICE_TOKEN são definidos como
    # variáveis de fleet/dispositivo no balenaCloud.
    volumes:
      - dashboard-data:/data

  browser:
    image: balenablocks/browser
    restart: always
    privileged: true
    network_mode: host
    environment:
      LAUNCH_URL: "http://127.0.0.1:3000"
      KIOSK: "1"
      SHOW_CURSOR: "0"
      ENABLE_GPU: "1"
      # EXTRA_FLAGS ACRESCENTA flags; FLAGS SUBSTITUI as padrões do bloco
      # (incluindo o dimensionamento automático da janela). Sem --window-size,
      # o bloco detecta a resolução real do painel — evita conteúdo cortado.
      EXTRA_FLAGS: "--disable-translate --disable-features=Translate,TranslateUI --lang=pt-BR --accept-lang=pt-BR,pt,en-US,en --noerrdialogs --disable-session-crashed-bubble --no-first-run --disable-pings --check-for-update-interval=31536000"
      
  

volumes:
  dashboard-data:
