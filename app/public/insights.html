<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard RDS Multimídia - TV Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/insights.css">
</head>
<body class="bg-[#0b0f19] text-gray-100 h-screen w-screen flex flex-col p-2 overflow-hidden select-none">

  <!-- Header Compacto (mesmo padrão da tela de gráficos) -->
  <header class="h-[52px] min-h-[52px] bg-[#131927] border border-gray-800/80 rounded-lg px-3 flex items-center justify-between shadow-md mb-2">
    <div class="flex items-center gap-3">
      <div class="flex items-center">
        <svg class="h-7" viewBox="0 0 170 60" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="30" r="5" fill="#DE302B"/>
          <rect x="22" y="16" width="10" height="28" rx="5" fill="#DE302B"/>
          <rect x="37" y="8" width="10" height="44" rx="5" fill="#FFB800"/>
          <rect x="52" y="16" width="10" height="28" rx="5" fill="#005C9E"/>
          <circle cx="67" cy="30" r="5" fill="#005C9E"/>
          <text x="82" y="41" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">rds</text>
        </svg>
      </div>
      <div class="h-6 w-[1px] bg-gray-700"></div>
      <div class="flex items-center gap-2 bg-[#1a2235] px-2.5 py-1 rounded border border-gray-700/60">
        <svg class="w-3.5 h-3.5 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <div class="flex items-center gap-2 leading-none">
          <span id="relogio-hora" class="font-mono text-sm font-bold text-amber-400 tracking-wider">00:00:00</span>
          <span id="relogio-data" class="text-[10px] text-gray-400 font-medium tracking-tight">--/--/----</span>
        </div>
      </div>
    </div>
    <div class="text-right">
      <h1 id="painel-titulo" class="text-sm font-bold text-white leading-tight">RDS Multimidia</h1>
      <p id="painel-subtitulo" class="text-[10px] text-gray-400">Painel corporativo & operação</p>
    </div>
  </header>

  <!-- Layout Principal Sem Scroll -->
  <main class="flex-1 flex flex-col min-h-0">

    <div class="mb-2 flex justify-between items-start shrink-0 px-1">
      <div>
        <span class="text-[9px] uppercase font-bold tracking-wider text-red-500 block leading-tight">RESUMO INTELIGENTE</span>
        <h2 class="text-xs md:text-sm font-bold text-white leading-tight">INSIGHTS OPERACIONAIS</h2>
      </div>
    </div>

    <div id="container-insights" class="flex-1 grid grid-cols-2 grid-rows-2 gap-2.5 min-h-0">
      <!-- Cards de insight são inseridos aqui via js/insights.js -->
      <div class="bg-[#131927] border border-gray-800/80 rounded-lg p-3 flex items-center justify-center shadow-md col-span-2 row-span-2">
        <span class="text-sm text-gray-500 italic">Buscando insights...</span>
      </div>
    </div>

  </main>

  <script src="js/insights.js"></script>

  <!-- ALTERAÇÃO: VOLTA PARA A TELA DE INFORMAÇÕES APÓS 1 MINUTO -->
  <script>
    setTimeout(function() {
      window.location.href = "index.html";
    }, 60000);
  </script>

</body>
</html>
