<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard RDS Multimídia - TV Mode</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="css/graficos.css">

</head>

<body class="bg-[#0b0f19] text-gray-100 h-screen w-screen flex flex-col p-2 overflow-hidden select-none">

  <!-- Header Compacto -->

  <header class="h-[52px] min-h-[52px] bg-[#131927] border border-gray-800/80 rounded-lg px-3 flex items-center justify-between shadow-md mb-2">

    <div class="flex items-center gap-3">

      <div class="flex items-center">

        <svg class="h-7" viewBox="0 0 170 60" fill="none" xmlns="http://www.w3.org/2000/svg">

          <circle cx="12" cy="30" r="5" fill="#DE302B"/>

          <rect x="22" y="16" width="10" height="28" rx="5" fill="#DE302B"/>

          <rect x="37" y="8" width="10" height="44" rx="5" fill="#FFB800"/>

          <rect x="52" y="16" width="10" height="28" rx="5" fill="#005C9E"/>

          <circle cx="67" cy="30" r="5" fill="#005C9E"/>

          <text x="82" y="41" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-1">rds</text>

        </svg>

      </div>

      <div class="h-6 w-[1px] bg-gray-700"></div>

      <div class="flex items-center gap-2 bg-[#1a2235] px-2.5 py-1 rounded border border-gray-700/60">

        <svg class="w-3.5 h-3.5 text-amber-400 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">

          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>

        </svg>

        <div class="flex items-center gap-2 leading-none">

          <span id="relogio-hora" class="font-mono text-sm font-bold text-amber-400 tracking-wider">00:00:00</span>

          <span id="relogio-data" class="text-[10px] text-gray-400 font-medium tracking-tight">--/--/----</span>

        </div>

      </div>

    </div>

    <div class="text-right">

      <h1 id="painel-titulo" class="text-sm font-bold text-white leading-tight">RDS Multimidia</h1>

      <p id="painel-subtitulo" class="text-[10px] text-gray-400">Painel corporativo & operação</p>

    </div>

  </header>

  <!-- Layout Principal Sem Scroll -->

  <main class="flex-1 flex flex-col gap-2 min-h-0">

    <div class="h-1/2 flex gap-2 min-h-0">

      <div class="w-1/2 bg-[#131927] border border-gray-800/80 rounded-lg p-2.5 flex flex-col min-h-0 shadow-md">

        <div class="mb-1 flex justify-between items-start shrink-0">

          <div>

            <span class="text-[9px] uppercase font-bold tracking-wider text-red-500 block leading-tight">VOLUME DIÁRIO</span>

            <h2 id="titulo-fluxo" class="text-xs md:text-sm font-bold text-white leading-tight">FLUXO OPERACIONAL DIÁRIO</h2>

          </div>

        </div>

        <div class="flex-1 relative w-full min-h-0">

          <canvas id="chartFluxo"></canvas>

        </div>

      </div>

      <div class="w-1/2 bg-[#131927] border border-gray-800/80 rounded-lg p-2.5 flex flex-col min-h-0 shadow-md">

        <div class="mb-1 flex justify-between items-start shrink-0">

          <div>

            <span class="text-[9px] uppercase font-bold tracking-wider text-amber-500 block leading-tight">STATUS DOS CHAMADOS</span>

            <h2 id="titulo-distribuicao" class="text-xs md:text-sm font-bold text-white leading-tight">DISTRIBUIÇÃO DE CHAMADOS</h2>

          </div>

        </div>

        <div class="flex-1 relative w-full min-h-0">

          <canvas id="chartCanal"></canvas>

        </div>

      </div>

    </div>

    <div class="h-1/2 bg-[#131927] border border-gray-800/80 rounded-lg p-2.5 flex flex-col min-h-0 shadow-md">

      <div class="mb-1 flex justify-between items-start shrink-0">

        <div>

          <span class="text-[9px] uppercase font-bold tracking-wider text-blue-400 block leading-tight">ANÁLISE POR CLIENTE</span>

          <h2 id="titulo-loja" class="text-xs md:text-sm font-bold text-white leading-tight">ANÁLISE DE CHAMADOS POR LOJA</h2>

        </div>

      </div>

      <div class="flex-1 relative w-full min-h-0">

        <canvas id="chartRendimento"></canvas>

      </div>

    </div>

  </main>

  <script src="js/graficos.js"></script>

  <!-- ALTERAÇÃO: VOLTA PARA A TELA DE INFORMAÇÕES APÓS 1 MINUTO -->

  <script>

    setTimeout(function() {

      window.location.href = "index.html";

    }, 60000);

  </script>

</body>

</html>
